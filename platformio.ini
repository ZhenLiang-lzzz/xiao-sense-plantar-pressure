[platformio]
; the repo path under OneDrive is too long for the toolchain on Windows
build_dir = ${sysenv.LOCALAPPDATA}/xiao-pressure-build

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-mbed-nrf52840-sense
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3
    arduino-libraries/ArduinoBLE

; one environment per board: pio run -e pressure1 -t upload
[env:pressure1]
build_flags = -D DEVICE_NAME=\"Pressure-1\"

[env:pressure2]
build_flags = -D DEVICE_NAME=\"Pressure-2\"

[env:pressure3]
build_flags = -D DEVICE_NAME=\"Pressure-3\"

[env:pressure4]
build_flags = -D DEVICE_NAME=\"Pressure-4\"
